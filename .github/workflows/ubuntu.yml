name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 13", os: ubuntu-24.04, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }
          - { name: "Ubuntu 24.04 arm GCC 13", os: ubuntu-24.04-arm, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }

    steps:
    - uses: actions/checkout@v7

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.18.0"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Python Test Dependencies
      if: matrix.build_type == 'Debug'
      run: python -m pip install pytest

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      env:
        CXXFLAGS: ${{ matrix.build_type == 'Debug' && matrix.config.libstdcxx_debug && '-D_GLIBCXX_DEBUG' || '' }}
      working-directory: ${{ runner.workspace }}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -G Ninja -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel $NPROC --target everything

    - name: Test C++
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -j $NPROC -LE python --output-on-failure


    - name: Test Python
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -L python -V --output-on-failure

    - name: Install Ariadne BDD
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix ${{ runner.workspace }}/install

    - name: Check Python BDD Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ github.workspace }}/python/tutorials
      env:
        PYTHONPATH: ${{ runner.workspace }}/install/lib/python3.13/site-packages
        LD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
        DYLD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
      run: |
        python -c "import os, pathlib, pyariadne; p=pathlib.Path(pyariadne.__file__).resolve(); root=pathlib.Path(os.environ['PYTHONPATH']).resolve(); assert p.is_relative_to(root), (p, root)"
        python tutorial_robdd.py


    - name: Prepare C++ BDD Tutorial
      if: matrix.build_type == 'Release'
      run: cmake -E copy_directory $GITHUB_WORKSPACE/tutorials/tutorial_robdd ${{ runner.workspace }}/tutorial_robdd

    - name: Check C++ BDD Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/tutorial_robdd
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/install -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -G Ninja
        cmake --build build --parallel $NPROC
        export LD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${LD_LIBRARY_PATH:-}
        export DYLD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${DYLD_LIBRARY_PATH:-}
        ./build/tutorial_robdd


    - name: Verify Uninstallation
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall

