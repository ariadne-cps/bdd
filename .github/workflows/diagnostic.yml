name: Diagnostic

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC diagnostic
            os: ubuntu-24.04
          - name: Windows MSVC diagnostic
            os: windows-2025

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config g++-13

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64

    - name: Configure Linux
      if: runner.os == 'Linux'
      id: configure_linux
      continue-on-error: true
      shell: bash
      run: |
        set +e
        cmake -S . -B build-diagnostic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-13 -DWARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log
        status=${PIPESTATUS[0]}
        exit ${status}

    - name: Configure Windows
      if: runner.os == 'Windows'
      id: configure_windows
      continue-on-error: true
      shell: pwsh
      run: |
        cmake -S . -B build-diagnostic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWARNINGS_AS_ERRORS=ON 2>&1 | Tee-Object -FilePath configure.log
        exit $LASTEXITCODE

    - name: Build
      if: (steps.configure_linux.outcome == 'success') || (steps.configure_windows.outcome == 'success')
      id: build
      continue-on-error: true
      shell: bash
      run: |
        set +e
        cmake --build build-diagnostic --parallel 2 --target everything 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        exit ${status}

    - name: Publish Linux diagnostic
      if: runner.os == 'Linux' && (steps.configure_linux.outcome == 'failure' || steps.build.outcome == 'failure')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        {
          echo 'CI diagnostic - Ubuntu GCC:'
          echo
          echo '~~~text'
          if [ -f build.log ]; then tail -n 180 build.log; else tail -n 180 configure.log; fi
          echo '~~~'
        } > diagnostic-comment.md
        gh pr comment "$PR_NUMBER" --body-file diagnostic-comment.md

    - name: Publish Windows diagnostic
      if: runner.os == 'Windows' && (steps.configure_windows.outcome == 'failure' || steps.build.outcome == 'failure')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        'CI diagnostic - Windows MSVC:' | Out-File diagnostic-comment.md
        '' | Out-File diagnostic-comment.md -Append
        '~~~text' | Out-File diagnostic-comment.md -Append
        if (Test-Path build.log) { Get-Content build.log -Tail 180 | Out-File diagnostic-comment.md -Append }
        else { Get-Content configure.log -Tail 180 | Out-File diagnostic-comment.md -Append }
        '~~~' | Out-File diagnostic-comment.md -Append
        gh pr comment "$env:PR_NUMBER" --body-file diagnostic-comment.md

    - name: Fail on diagnostic failure
      if: steps.configure_linux.outcome == 'failure' || steps.configure_windows.outcome == 'failure' || steps.build.outcome == 'failure'
      run: exit 1
