name: Diagnostic

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config g++-13

    - name: Configure
      id: configure
      shell: bash
      run: |
        set +e
        cmake -S . -B build-diagnostic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-13 -DWARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log
        status=${PIPESTATUS[0]}
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        exit ${status}

    - name: Build
      if: steps.configure.outcome == 'success'
      id: build
      continue-on-error: true
      shell: bash
      run: |
        set +e
        cmake --build build-diagnostic --parallel 2 --target everything 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        exit ${status}

    - name: Publish diagnostic
      if: failure() || steps.build.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        {
          echo 'CI diagnostic (temporary workflow):'
          echo
          echo '~~~text'
          if [ -f build.log ]; then
            tail -n 160 build.log
          else
            tail -n 160 configure.log
          fi
          echo '~~~'
        } > diagnostic-comment.md
        gh pr comment "$PR_NUMBER" --body-file diagnostic-comment.md

    - name: Fail if build failed
      if: steps.build.outcome == 'failure'
      run: exit 1
