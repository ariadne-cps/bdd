name: macOS

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "macOS 26 arm AppleClang 21", os: macos-26, cxx: "/usr/bin/clang++" }

    steps:
    - uses: actions/checkout@v7

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
      with:
        version: "v0.18.0"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Python Test Dependencies
      if: matrix.build_type == 'Debug'
      run: python -m pip install pytest

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: echo "NPROC=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: brew install ninja pkg-config

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Initialize optional sccache before compilation
      run: |
        git submodule update --init -- ss/bui
        cmake -P ss/bui/cmake/InitializeSccache.cmake

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" -G Ninja -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build Release library and bindings
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel $NPROC --target ariadne-bdd bindings

    - name: Build Release benchmarks
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel $NPROC --target benchmarks

    - name: Build Debug tests and bindings
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel $NPROC --target tests bindings

    - name: Test C++
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -j $NPROC -LE python --output-on-failure


    - name: Test Python
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -L python -V --output-on-failure

    - name: Install Ariadne BDD
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix ${{ runner.workspace }}/install

    - name: Prepare C++ BDD Tutorial
      if: matrix.build_type == 'Release'
      run: cmake -E copy_directory $GITHUB_WORKSPACE/tutorial ${{ runner.workspace }}/tutorial_bdd

    - name: Check C++ BDD Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/tutorial_bdd
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/install -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" -G Ninja
        cmake --build build --parallel $NPROC
        export LD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${LD_LIBRARY_PATH:-}
        export DYLD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${DYLD_LIBRARY_PATH:-}
        ./build/tutorial_bdd


    - name: Check Python BDD Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ github.workspace }}/tutorial
      env:
        PYTHONPATH: ${{ runner.workspace }}/install/lib/python3.13/site-packages
        LD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
        DYLD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
      run: |
        python -c "import os, pathlib, pyariadne_bdd; p=pathlib.Path(pyariadne_bdd.__file__).resolve(); root=pathlib.Path(os.environ['PYTHONPATH']).resolve(); assert p.is_relative_to(root), (p, root)"
        python tutorial_bdd.py


    - name: Verify Uninstallation
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall

