name: Unix

on:
  push:
    branches:
      - main
  pull_request:

env:
  BUILD_TYPE: Release
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "macOS 15 AppleClang [Release]",
            os: macos-15,
            cxx-cmd: "clang++"
          }
          - {
            name: "Ubuntu 24.04 Clang 16 [Release]",
            os: ubuntu-24.04,
            cxx-pkg: "clang-16",
            cxx-cmd: "clang++-16"
          }
          - {
            name: "Ubuntu 24.04 GCC 13 [Release]",
            os: ubuntu-24.04,
            cxx-pkg: "g++-13",
            cxx-cmd: "g++-13"
          }

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.18.0"

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: |
        echo NPROC="sysctl -n hw.ncpu" >> $GITHUB_ENV
        echo "Running on $(sysctl -n hw.ncpu) threads ..."

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: |
        echo NPROC="nproc" >> $GITHUB_ENV
        echo "Running on $(nproc) threads ..."

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: brew install ninja ${{matrix.config.cxx-pkg}}

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt install -y cmake ninja-build pkg-config ${{matrix.config.cxx-pkg}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER=${{matrix.config.cxx-cmd}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -G Ninja -DWARNINGS_AS_ERRORS=ON

    - name: Build
      working-directory: ${{runner.workspace}}/build
      run: cmake --build . --parallel $($NPROC) --target everything

    - name: Test
      working-directory: ${{runner.workspace}}/build
      run: ctest -j $($NPROC) --output-on-failure

  thread-sanitizer:
    name: Ubuntu 24.04 Clang 16 [ThreadSanitizer]
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.18.0"

    - name: Set Up Dependencies
      run: sudo apt install -y cmake ninja-build pkg-config clang-16

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build-tsan

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build-tsan
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-16 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DTHREAD_SANITIZER=ON -G Ninja -DWARNINGS_AS_ERRORS=ON

    - name: Build
      working-directory: ${{runner.workspace}}/build-tsan
      run: cmake --build . --parallel 2

    - name: Test
      working-directory: ${{runner.workspace}}/build-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1
      run: ctest --output-on-failure
